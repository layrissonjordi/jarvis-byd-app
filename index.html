<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Jarvis BYD</title>
  <style>
    :root { --bg:#0b0f1a; --card:#161c2e; --ink:#e8ecf6; --muted:#8a93ab; --ok:#2ecc71; --warn:#e67e22; --accent:#1e88e5; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; }
    header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; margin-right:6px; }
    .dot.online { background:var(--ok); } .dot.offline { background:var(--warn); }
    main { padding: 0 14px 28px; max-width: 560px; margin: 0 auto; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .card { background:var(--card); border-radius:16px; padding:16px; }
    .card .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
    .card .value { font-size:28px; font-weight:700; margin-top:6px; }
    .card .sub { color:var(--muted); font-size:13px; margin-top:2px; }
    .wide { grid-column: 1 / -1; }
    .bar { height:10px; border-radius:6px; background:#0b1222; overflow:hidden; margin-top:10px; }
    .bar > i { display:block; height:100%; background:linear-gradient(90deg,#2ecc71,#1e88e5); width:0; transition:width .4s; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; font-size:13px; background:#0b1222; color:var(--ink); }
    .pill.alert { background:#3a1d1d; color:#ff8a80; }
    .muted { color:var(--muted); }
    .trips { list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px; }
    .trips li { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:8px 0; border-top:1px solid #243049; }
    .trips li:first-child { border-top:0; }
    .trips .km { font-weight:700; } .trips .eff { color:var(--muted); font-variant-numeric:tabular-nums; }
    #toasts { position:fixed; left:0; right:0; bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:grid; gap:8px; padding:0 16px; z-index:20; pointer-events:none; }
    .toast { background:var(--accent); color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.35); animation:up .3s ease; }
    .toast.alert { background:#c0392b; }
    @keyframes up { from { transform:translateY(12px); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .toast { animation:none; } }
    form { background:var(--card); border-radius:16px; padding:16px; display:grid; gap:10px; }
    input { background:#0b1222; border:1px solid #243049; color:var(--ink); border-radius:10px; padding:11px 12px; font-size:15px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font-size:15px; font-weight:600; }
    button.ghost { background:transparent; color:var(--muted); }
    .hidden { display:none; }
    .cam-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .cam-head select { background:#0b1222; border:1px solid #243049; color:var(--ink); border-radius:10px; padding:8px 10px; font-size:14px; }
    .live { color:#ff5252; font-size:13px; font-weight:600; }
    #camVideo { width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; margin-top:10px; object-fit:contain; }
    .cam-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    button:disabled { opacity:.45; }
    .clima { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    footer { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
  </style>
</head>
<body>
  <header>
    <h1>🚗 Jarvis BYD</h1>
    <span id="status"><span class="dot" id="dot"></span><span id="statusText" class="muted">desconectado</span></span>
  </header>

  <main>
    <!-- Painel -->
    <section id="dash" class="hidden">
      <div class="grid">
        <div class="card wide">
          <div class="label">Bateria</div>
          <div class="value"><span id="bateria">—</span><span class="muted" style="font-size:18px">%</span></div>
          <div class="sub"><span id="carregando"></span><span id="autonomia">—</span> km de autonomia</div>
          <div class="bar"><i id="batBar"></i></div>
        </div>
        <div class="card">
          <div class="label">Climatização</div>
          <div class="value" id="arVal">—</div>
          <div class="sub"><span id="temp">—</span> · vento <span id="vent">—</span></div>
        </div>
        <div class="card">
          <div class="label">Lá fora</div>
          <div class="value" id="fora">—</div>
          <div class="sub" id="odometro"></div>
        </div>
        <div class="card wide">
          <div class="label">Controlar o ar</div>
          <div class="clima">
            <button type="button" id="arBotao" data-clima="ar" disabled>Ligar ar</button>
            <button type="button" data-clima="desemb" disabled>Desembaçar</button>
            <button type="button" data-clima="temp-" disabled aria-label="Menos temperatura">− 1 °C</button>
            <button type="button" data-clima="temp+" disabled aria-label="Mais temperatura">+ 1 °C</button>
            <button type="button" data-clima="vent-" disabled aria-label="Menos vento">− vento</button>
            <button type="button" data-clima="vent+" disabled aria-label="Mais vento">+ vento</button>
          </div>
          <div class="sub" id="climaStatus" aria-live="polite"></div>
        </div>
        <div class="card">
          <div class="label">Portas</div>
          <div class="value" style="font-size:20px"><span class="pill" id="portas">—</span></div>
          <div class="sub">Janelas: <span id="janelas">—</span></div>
        </div>
        <div class="card wide" id="camCard">
          <div class="cam-head">
            <select id="camSel" aria-label="Câmera" disabled></select>
            <span id="camLive" class="live hidden">● ao vivo</span>
          </div>
          <video id="camVideo" autoplay playsinline muted></video>
          <div class="sub"><span id="camStatus">aguardando o carro</span> <span id="camInfo"></span></div>
          <div class="cam-btns">
            <button type="button" id="camStart" disabled>Ver ao vivo</button>
            <button type="button" id="camStop" class="ghost" disabled>Encerrar</button>
          </div>
        </div>
        <div class="card wide">
          <div class="label">Viagens recentes</div>
          <ul id="viagens" class="trips"><li class="muted" id="semViagens">Nenhuma viagem ainda.</li></ul>
        </div>
      </div>
      <footer>Atualizado <span id="quando">—</span> · <a href="#" id="trocar" class="muted">trocar carro</a></footer>
    </section>

    <!-- Pareamento / configuração do broker -->
    <form id="setup">
      <p class="muted" style="margin:0 0 4px">Conecte ao seu carro (endereço, usuário e senha do EMQX).</p>
      <input id="host" placeholder="endereço (ex.: abc.ala.us-east-1.emqxsl.com)" autocomplete="off" />
      <input id="port" placeholder="porta (vazio = automática)" inputmode="numeric" />
      <input id="user" placeholder="usuário" autocomplete="off" />
      <input id="pass" type="password" placeholder="senha" autocomplete="off" />
      <input id="car" placeholder="id do carro (ex.: demo)" value="demo" autocomplete="off" />
      <button type="submit">Conectar</button>
      <button type="button" class="ghost" id="limpar">Esquecer dados salvos</button>
    </form>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
